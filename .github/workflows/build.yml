name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unzip project
        run: unzip -o CustomPlaceholders.zip
      - name: Build
        run: mvn -B clean package
        working-directory: CustomPlaceholders
      - uses: actions/upload-artifact@v4
        with:
          name: CustomPlaceholders
          path: CustomPlaceholders/target/*.jar
